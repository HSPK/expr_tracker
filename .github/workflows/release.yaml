name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  web:
    name: Build viewer assets
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-assets
          path: src/expr_tracker/_web
          include-hidden-files: true

  wheels:
    name: Wheel ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: viewer-assets
          path: src/expr_tracker/_web
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build native wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist
      - name: Verify installed distribution
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "from expr_tracker import _native; from importlib.resources import files; assert _native.implementation == 'rust'; assert (files('expr_tracker') / '_web' / 'index.html').is_file()"
          python -c "import tempfile; import expr_tracker as et; d=tempfile.mkdtemp(); et.init(project='smoke',run_dir=d,backends=[],max_file_bytes=100); et.log({'loss':1.0}); assert et.history(1)[0]['loss']==1.0; et.finish()"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: viewer-assets
          path: src/expr_tracker/_web
      - uses: astral-sh/setup-uv@v6
      - name: Verify release version and build source distribution
        run: |
          uv run --no-project python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb')); c=tomllib.load(open('Cargo.toml','rb')); assert p['project']['version'] == c['package']['version']; import os; ref=os.environ['GITHUB_REF_NAME']; assert not ref.startswith('v') or ref[1:] == p['project']['version']"
          uv build --sdist
          uv run --no-project python -c "import glob,tarfile; names=tarfile.open(glob.glob('dist/*.tar.gz')[0]).getnames(); assert not any('/node_modules/' in p or '/target/' in p or p.endswith('.so') for p in names); assert any(p.endswith('src/expr_tracker/_web/index.html') for p in names)"
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

  release:
    name: Build and publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      # required for PyPI trusted publishing (OIDC)
      id-token: write
      # required to create the GitHub release
      contents: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
