[project]
name = "expr_tracker"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "HSPK", email = "whxway@whu.edu.cn" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "loguru>=0.7.3",
    "pydantic>=2.0",
]

dynamic = ["version"]

[project.optional-dependencies]
# Local-first by default: remote backends and rich frames are opt-in.
lark = ["slark>=0.1.28"]
wandb = ["wandb>=0.21.0"]
trackio = ["trackio>=0.4.0"]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
all = [
    "slark>=0.1.28",
    "wandb>=0.21.0",
    "trackio>=0.4.0",
    "pandas>=1.5",
    "polars>=0.20",
]

[project.scripts]
et = "expr_tracker.cli:main"

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "ipykernel>=6.30.1",
    "slark>=0.1.28",
    "wandb>=0.21.0",
    "trackio>=0.4.0",
    "numpy>=1.24",
    "pandas>=1.5",
    "pytest>=8.0",
    "ruff>=0.16.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running stress tests",
    "benchmark: timing and memory benchmarks",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "FURB"]
ignore = [
    # The tracker must never break a training loop, so broad excepts are deliberate.
    "BLE001",
    # Per-item try/except is intentional: one bad backend, rule or record must not
    # abort the whole loop.
    "PERF203",
    # Vendored FastAPI encoder keeps its upstream re-export style.
    "PLC0414",
]

[tool.ruff.lint.per-file-ignores]
"src/expr_tracker/encoders.py" = ["UP", "RUF", "SIM", "B", "C4", "FURB", "PERF"]
# Alert levels intentionally use emoji glyphs.
"src/expr_tracker/alerts/backends/__init__.py" = ["RUF001"]
"src/expr_tracker/_compat.py" = ["UP", "RUF"]
"tests/*" = ["E501"]
