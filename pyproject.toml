[project]
name = "expr_tracker"
version = "0.4.1"
description = "Local-first experiment tracking with queryable history and expression-based alerts on your training metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HSPK", email = "whxway@whu.edu.cn" }]
requires-python = ">=3.10"
keywords = [
    "machine-learning",
    "experiment-tracking",
    "mlops",
    "monitoring",
    "alerting",
    "training",
    "deep-learning",
    "wandb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "filelock>=3.12",
    "loguru>=0.7.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Local-first by default: remote backends and rich frames are opt-in.
wandb = ["wandb>=0.21.0"]
trackio = ["trackio>=0.4.0"]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
gpu = ["nvidia-ml-py>=12.0"]
all = [
    "wandb>=0.21.0",
    "trackio>=0.4.0",
    "pandas>=1.5",
    "polars>=0.20",
    "nvidia-ml-py>=12.0",
]

[project.urls]
Homepage = "https://hspk.github.io/expr_tracker/"
Documentation = "https://hspk.github.io/expr_tracker/"
Repository = "https://github.com/HSPK/expr_tracker"
Issues = "https://github.com/HSPK/expr_tracker/issues"
Changelog = "https://github.com/HSPK/expr_tracker/releases"

[project.scripts]
et = "expr_tracker.cli:main"

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
dev = [
    "ipykernel>=6.30.1",
    "wandb>=0.21.0",
    "trackio>=0.4.0",
    "numpy>=1.24",
    "pandas>=1.5",
    "pytest>=8.0",
    "ruff>=0.16.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "expr_tracker._native"
features = ["extension-module"]
profile = "release"
include = [
    { path = "src/expr_tracker/_web/**/*", format = ["wheel", "sdist"] },
    { path = "web/package.json", format = "sdist" },
    { path = "web/package-lock.json", format = "sdist" },
    { path = "web/index.html", format = "sdist" },
    { path = "web/tsconfig.json", format = "sdist" },
    { path = "web/vite.config.ts", format = "sdist" },
    { path = "web/vitest.config.ts", format = "sdist" },
    { path = "web/playwright.config.ts", format = "sdist" },
    { path = "web/src/**/*", format = "sdist" },
    { path = "web/e2e/**/*", format = "sdist" },
    { path = "rust/**/*", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "benchmarks/*.py", format = "sdist" },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/*.rs" },
    { file = "src/expr_tracker/**/*.py" },
    { file = "src/expr_tracker/_web/**/*" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running stress tests",
    "benchmark: timing and memory benchmarks",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "FURB"]
ignore = [
    # The tracker must never break a training loop, so broad excepts are deliberate.
    "BLE001",
    # Per-item try/except is intentional: one bad backend, rule or record must not
    # abort the whole loop.
    "PERF203",
    # Vendored FastAPI encoder keeps its upstream re-export style.
    "PLC0414",
]

[tool.ruff.lint.per-file-ignores]
"src/expr_tracker/encoders.py" = ["UP", "RUF", "SIM", "B", "C4", "FURB", "PERF"]
# Alert levels intentionally use emoji glyphs.
"src/expr_tracker/alerts/backends/__init__.py" = ["RUF001"]
"src/expr_tracker/_compat.py" = ["UP", "RUF"]
"tests/*" = ["E501"]
